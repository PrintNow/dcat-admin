name: PHPStan

on:
  push:
    branches: ['2.0', 'release/**']
  pull_request:
    branches: ['2.0', 'release/**']

jobs:
  phpstan:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      # Laravel 10/11 已停止安全维护，Composer >= 2.10 默认拒绝加载带安全公告的版本，
      # 会导致 PHP 8.1 无可安装版本；仅在 CI 中关闭该阻断以保留低版本矩阵。
      - run: composer config policy.advisories.block false

      - run: composer install --no-interaction --prefer-dist

      # 禁止使用 baseline 冻结报错：新问题必须修复，或在 phpstan.neon 中按 identifier + path + 理由显式忽略
      - name: Forbid PHPStan baseline
        run: |
          if [ -f phpstan-baseline.neon ] || grep -qE "^\s*-\s*\S*baseline\S*\.neon" phpstan.neon; then
            echo "::error::不允许使用 phpstan-baseline.neon，请修复问题或在 phpstan.neon 中写明理由后显式忽略"
            exit 1
          fi

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M --error-format=github
